<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoFlowBar — your EcoFlow battery in the Mac menu bar</title>
<meta name="description" content="Real time remaining, automatic Mac protection, charge window management. 100% local over Bluetooth. Free and open source.">
<link rel="icon" href="icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Segoe UI",sans-serif;
    background:#0b0d15; color:#f2f3f7; min-height:100vh; overflow-x:hidden;
  }
  ::selection { background:#b89eff55; }

  /* ---------- Aurora : se lève au chargement, puis dérive ---------- */
  .aurora {
    position:fixed; inset:auto 0 -35vh 0; height:82vh; z-index:0;
    pointer-events:none; filter:blur(90px); opacity:.55;
    transform-origin:bottom; transform:scaleY(.05);
    animation:rise 1.8s cubic-bezier(.22,1,.36,1) .2s forwards;
  }
  @keyframes rise { to { transform:scaleY(1); } }
  .aurora span {
    position:absolute; bottom:0; width:42vw; height:46vh; border-radius:50%;
    animation:drift 14s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1){ left:-12vw; background:#ff7aa6; animation-delay:0s }
  .aurora span:nth-child(2){ left:8vw;   background:#ff523d; animation-delay:-3s }
  .aurora span:nth-child(3){ left:30vw;  background:#ffcc4d; animation-delay:-6s }
  .aurora span:nth-child(4){ left:52vw;  background:#b89eff; animation-delay:-9s }
  .aurora span:nth-child(5){ left:74vw;  background:#528aff; animation-delay:-12s }
  @keyframes drift { to { transform:translate(3vw,-4vh); } }

  main { position:relative; z-index:1; max-width:960px; margin:0 auto; padding:0 24px; }

  /* ---------- Barre du haut : nom + langues ---------- */
  nav {
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 0; opacity:0; animation:fadein .8s ease 1s forwards;
  }
  nav .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:14px; }
  nav .brand img { width:26px; height:26px; }
  .langs { display:flex; gap:4px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08); border-radius:999px; padding:3px; }
  .langs button {
    all:unset; cursor:pointer; font-size:11.5px; font-weight:600; color:#9aa0b4;
    padding:4px 10px; border-radius:999px; transition:all .2s;
  }
  .langs button:hover { color:#f2f3f7; }
  .langs button.on { background:#f2f3f7; color:#0b0d15; }

  /* ---------- Héros ---------- */
  .hero { text-align:center; padding:7vh 0 6vh; }
  .orb-wrap { position:relative; display:inline-block; }
  .orb {
    position:absolute; inset:-46px; border-radius:50%; z-index:-1; filter:blur(34px); opacity:.5;
    background:conic-gradient(#528aff,#b89eff,#ff7aa6,#ff523d,#ffcc4d,#528aff);
    animation:spin 14s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hero img.icon {
    width:132px; height:132px;
    animation:breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform:scale(1.045) translateY(-3px); } }
  h1 {
    font-size:clamp(68px,13vw,138px); font-weight:900; font-stretch:condensed;
    letter-spacing:-.03em; line-height:.95; margin:20px 0 16px; min-height:1em;
  }
  h1 .ch {
    display:inline-block; opacity:0; filter:blur(9px);
    transform:translateY(18px) rotateY(20deg);
    animation:chIn .65s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes chIn { to { opacity:1; filter:blur(0); transform:none; } }
  .tagline {
    font-size:19px; color:#b9bdcc; max-width:580px; margin:0 auto 34px; line-height:1.55;
    opacity:0; animation:fadeup .9s ease 1.5s forwards;
  }
  .cta-zone { opacity:0; animation:fadeup .9s ease 1.9s forwards; }
  @keyframes fadeup { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes fadein { to { opacity:1; } }
  .cta {
    display:inline-block; background:#f2f3f7; color:#0b0d15; font-size:17px; font-weight:600;
    text-decoration:none; padding:15px 40px; border-radius:999px;
    transition:transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s;
  }
  .cta:hover { transform:scale(1.05); box-shadow:0 8px 40px #b89eff44; }
  .meta { margin-top:15px; font-size:13px; color:#7a7f92; }

  /* ---------- Maquette barre de menus ---------- */
  .scene { height:340vh; }
  .scene-sticky {
    position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; padding-top:9vh;
  }
  .scene-title { font-size:clamp(28px,4.5vw,42px); font-weight:800; letter-spacing:-.02em;
    margin-bottom:8px; opacity:0; transform:translateY(10px); }
  .scene-sub { font-size:15px; color:#a9aebe; max-width:440px; text-align:center;
    line-height:1.5; margin-bottom:34px; opacity:0; transform:translateY(10px); }
  .menubar {
    display:flex; align-items:center; justify-content:flex-end; gap:18px;
    background:rgba(28,30,42,.85); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08); border-radius:12px;
    padding:8px 16px; font-size:13.5px; font-weight:500; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .menubar { width:min(640px,88vw); }
  .menubar .ef { display:flex; align-items:center; gap:7px; font-variant-numeric:tabular-nums;
    padding:3px 9px; margin:-3px 0; border-radius:6px; transition:background .3s; }
  .menubar .ef.open { background:rgba(255,255,255,.14); }
  .menubar .glyph { display:block; opacity:.92; }
  .menubar .dim { color:#e6e8ef; opacity:.85; font-size:12.5px; }
  .menubar-caption { text-align:center; font-size:12.5px; color:#7a7f92; margin-top:18px; }

  /* Panneau : réplique fidèle de l'app (mode clair), ouvert par le scroll */
  .panel-scale { transform-origin:top center; }
  @media (max-height:860px) { .panel-scale { transform:scale(.8); } }
  .panel {
    width:294px; margin-top:10px; padding:16px 15px 10px;
    background:rgba(245,245,247,.97); color:#1c1c1e;
    border:1px solid rgba(0,0,0,.08); border-radius:20px;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
    transform-origin:top center; opacity:0; will-change:transform,opacity;
    text-align:left;
  }
  .p-part { opacity:0; transform:translateY(8px); will-change:transform,opacity; }
  .p-ringwrap { position:relative; width:126px; height:126px; margin:4px auto 24px; }
  .panel .ring {
    position:absolute; inset:0; border-radius:50%; background:#30d158; animation:none;
    -webkit-mask:radial-gradient(closest-side,transparent 70%,#000 72%);
            mask:radial-gradient(closest-side,transparent 70%,#000 72%);
  }
  .ring-center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .ring-center .pct { font-size:29px; font-weight:800; color:#000; font-variant-numeric:tabular-nums; }
  .p-badge {
    position:absolute; top:-5px; right:-10px; width:26px; height:26px; border-radius:50%;
    background:#e9e9ee; display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.18); z-index:1;
  }
  .p-capsule {
    position:absolute; left:50%; bottom:-13px; transform:translateX(-50%);
    background:#e9e9ee; border:1px solid rgba(0,0,0,.05); border-radius:999px;
    padding:3px 13px; font-size:11px; font-weight:600; white-space:nowrap;
  }
  .p-sechead {
    display:flex; justify-content:space-between; align-items:center;
    font-size:10.5px; font-weight:700; color:#0a84ff;
    letter-spacing:.06em; text-transform:uppercase; margin:2px 0 5px;
  }
  .seg { display:flex; gap:2px; background:#e3e3e8; border-radius:7px; padding:2px; }
  .seg b, .seg i { font-style:normal; font-size:10px; font-weight:600; padding:2px 8px;
    border-radius:5px; color:#3c3c43; }
  .seg b { background:#0a84ff; color:#fff; }
  .chart { width:100%; display:block; }
  .legend { display:flex; gap:11px; font-size:9.5px; color:#6e6e73; margin:3px 0 10px; }
  .legend i { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
  .panel .row { display:flex; align-items:center; gap:8px; font-size:12px; padding:6.5px 2px;
    border-bottom:1px solid #e8e8ec; }
  .panel .row .dot { width:7px; height:7px; border-radius:50%; }
  .panel .row .v { margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }
  .panel .v.sm { font-size:10.5px; }
  .p-switchrow { display:flex; align-items:center; gap:8px; font-size:12px; padding:10px 2px 8px; }
  .switch { margin-left:auto; flex-shrink:0; width:34px; height:20px; border-radius:999px;
    background:#0a84ff; position:relative; }
  .switch .knob { position:absolute; top:2px; right:2px; width:16px; height:16px;
    border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .p-bottom { display:flex; justify-content:space-between; align-items:center; font-size:12px;
    color:#3c3c43; padding:7px 2px 3px; border-top:1px solid #e8e8ec; }

  /* ---------- Cartes ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:16px; padding:5vh 0 9vh; }
  .card {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07);
    border-radius:16px; padding:26px; opacity:0; transform:translateY(26px);
    transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1),
               border-color .25s, background .25s, box-shadow .25s;
  }
  .card.seen { opacity:1; transform:none; }
  .card:hover { border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.07);
    box-shadow:0 14px 44px rgba(0,0,0,.35); }
  .card h3 { font-size:15px; font-weight:700; margin-bottom:8px; }
  .card p { font-size:13.5px; color:#a9aebe; line-height:1.55; }
  .card .em { font-size:23px; display:block; margin-bottom:12px; }

  footer { position:relative; z-index:1; text-align:center; padding:4vh 24px 6vh;
    font-size:12.5px; color:#6b7080; line-height:1.8; }
  footer a { color:#9aa0b4; }

  @media (prefers-reduced-motion:reduce) {
    *, .aurora { animation-duration:.01s !important; animation-delay:0s !important; }
  }
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span><span></span><span></span></div>
<main>
  <nav>
    <div class="brand"><img src="icon.png" alt=""> EcoFlowBar</div>
    <div class="langs" id="langs"></div>
  </nav>

  <section class="hero">
    <div class="orb-wrap"><div class="orb"></div><img class="icon" src="icon.png" alt="EcoFlowBar icon"></div>
    <h1 id="greeting"></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="cta-zone">
      <a class="cta" href="https://github.com/matguig/ecoflowbar/releases/latest" data-i18n="cta"></a>
      <p class="meta" data-i18n="meta"></p>
    </div>
    </section>

  <section class="scene" id="scene">
    <div class="scene-sticky">
      <h2 class="scene-title" id="scene-title" data-i18n="ringTitle"></h2>
      <p class="scene-sub" id="scene-sub" data-i18n="ringSub"></p>
      <div class="menubar">
        <span class="ef" id="mb-item">
          <svg id="icon-batt" class="glyph" width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.75" y="0.75" width="21.5" height="11.5" rx="3.25" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/><rect id="batt-fill" x="2.6" y="2.6" width="17.8" height="7.8" rx="1.6" fill="#fff"/><path d="M24.2 4.2 C25.6 4.8 25.6 8.2 24.2 8.8 Z" fill="rgba(255,255,255,.4)"/></svg>
          <svg id="icon-plug" class="glyph" width="17" height="15" viewBox="0 0 17 15" aria-hidden="true" style="display:none"><path d="M1 5.2 H4 M1 9.8 H4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M4.5 3 h4 a4.5 4.5 0 0 1 0 9 h-4 a1.4 1.4 0 0 1 -1.4-1.4 v-6.2 a1.4 1.4 0 0 1 1.4-1.4 Z" fill="#fff"/><path d="M13.4 7.5 H16" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span id="mb-label">98% 12:13</span>
        </span>
        <svg class="glyph dim" width="17" height="13" viewBox="0 0 17 13" aria-hidden="true"><path d="M8.5 11.6 L6.3 9.2 a3.4 3.4 0 0 1 4.4 0 Z" fill="#fff"/><path d="M3.9 6.7 a6.8 6.8 0 0 1 9.2 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M1.4 4 a10.4 10.4 0 0 1 14.2 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/></svg>
        <svg class="glyph dim" width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.7" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="7.5" cy="5.8" r="2" fill="#fff"/><path d="M3.4 11.6 a4.6 4.6 0 0 1 8.2 0" fill="#fff"/></svg>
        <svg class="glyph dim" width="17" height="15" viewBox="0 0 17 15" aria-hidden="true"><rect x="0.7" y="1" width="15.6" height="5.4" rx="2.7" fill="none" stroke="#fff" stroke-width="1.3"/><circle cx="4.2" cy="3.7" r="1.9" fill="#fff"/><rect x="0.7" y="8.6" width="15.6" height="5.4" rx="2.7" fill="none" stroke="#fff" stroke-width="1.3"/><circle cx="12.8" cy="11.3" r="1.9" fill="#fff"/></svg>
        <span class="dim" id="mb-clock">Sun Aug 9 16:51</span>
      </div>
      <div class="panel-scale"><div class="panel" id="panel">
        <div class="p-part p-ringwrap">
          <span class="p-badge"><svg width="13" height="12" viewBox="0 0 17 15"><path d="M1 5.2 H4 M1 9.8 H4" stroke="#0a84ff" stroke-width="1.7" stroke-linecap="round"/><path d="M4.5 3 h4 a4.5 4.5 0 0 1 0 9 h-4 a1.4 1.4 0 0 1 -1.4-1.4 v-6.2 a1.4 1.4 0 0 1 1.4-1.4 Z" fill="#0a84ff"/><path d="M13.4 7.5 H16" stroke="#0a84ff" stroke-width="1.7" stroke-linecap="round"/></svg></span>
          <div class="ring"></div>
          <div class="ring-center"><span class="pct"><span id="pct">100</span>%</span></div>
          <span class="p-capsule" data-i18n="statePlugged"></span>
        </div>
        <div class="p-part">
          <div class="p-sechead"><span data-i18n="histTitle"></span><span class="seg"><b>1 h</b><i>6 h</i><i>24 h</i></span></div>
          <svg class="chart" viewBox="0 0 240 70" aria-hidden="true">
            <path d="M0 8 C30 8 40 14 60 12 C90 9 130 8 240 8 L240 58 L0 58 Z" fill="rgba(48,209,88,.14)"/>
            <path d="M0 8 C30 8 40 14 60 12 C90 9 130 8 240 8" stroke="#30d158" stroke-width="1.6" fill="none"/>
            <path d="M0 30 L14 44 L26 40 L34 47 L52 45 L60 34 L74 46 L92 44 L108 47 L124 40 L138 46 L168 44 L190 47 L214 43 L240 40" stroke="#ff9f0a" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
            <path d="M0 54 L240 54" stroke="#ff453a" stroke-width="1.1" stroke-dasharray="3 3"/>
            <text x="52" y="68" font-size="7" fill="#98989f">16:08</text>
            <text x="118" y="68" font-size="7" fill="#98989f">16:23</text>
            <text x="184" y="68" font-size="7" fill="#98989f">16:38</text>
          </svg>
          <div class="legend">
            <span><i style="background:#30d158"></i><span data-i18n="legBatt"></span></span>
            <span><i style="background:#ff9f0a"></i><span data-i18n="legLoad"></span></span>
            <span><i style="background:#ff453a"></i><span data-i18n="legCpu"></span></span>
          </div>
        </div>
        <div class="p-part">
          <div class="p-sechead">RIVER 3 PLUS</div>
          <div class="row"><span class="dot" style="background:#30d158"></span><span data-i18n="rowMac"></span><span class="v" data-i18n="rowYes"></span></div>
          <div class="row"><span class="dot" style="background:#0a84ff"></span><span data-i18n="rowState"></span><span class="v" data-i18n="statePlugged"></span></div>
          <div class="row"><span class="dot" style="background:#98989f"></span><span data-i18n="rowRaw"></span><span class="v sm" data-i18n="rawValue"></span></div>
          <div class="p-sechead" style="margin-top:10px" data-i18n="secFlux"></div>
          <div class="row"><span class="dot" style="background:#ffd60a"></span><span data-i18n="rowIn"></span><span class="v">17 W</span></div>
          <div class="row"><span class="dot" style="background:#0a84ff"></span><span data-i18n="rowOut"></span><span class="v">17 W</span></div>
          <div class="row"><span class="dot" style="background:#bf5af2"></span><span data-i18n="rowUsb"></span><span class="v">0 W</span></div>
          <div class="row"><span class="dot" style="background:#ff2d55"></span><span data-i18n="rowCpu"></span><span class="v">0.8 W</span></div>
          <div class="row"><span class="dot" style="background:#ff9f0a"></span><span data-i18n="rowTemp"></span><span class="v">35 °C</span></div>
          <div class="row"><span class="dot" style="background:#64d2b1"></span><span data-i18n="rowEnergy"></span><span class="v sm">↓ 31 · ↑ 56 Wh</span></div>
        </div>
        <div class="p-part p-foot2">
          <div class="p-switchrow"><span data-i18n="rowActions"></span><span class="switch"><span class="knob"></span></span></div>
          <div class="p-bottom"><span>⚙︎ <span data-i18n="footSettings"></span></span><span class="p-icons">☾&nbsp;&nbsp;▤&nbsp;&nbsp;⏻</span></div>
        </div>
      </div></div>
      <p class="menubar-caption" data-i18n="demoCaption"></p>
    </div>
  </section>

  <section class="grid" id="grid"></section>
</main>
<footer>
  <a href="https://github.com/matguig/ecoflowbar" data-i18n="footSource"></a> ·
  <span data-i18n="footLib"></span> <a href="https://github.com/rabits/ha-ef-ble">ha-ef-ble</a><br>
  <span data-i18n="footDisclaimer"></span>
</footer>

const LANGS = ["en","fr","de","ja","zh"];
const NAMES = { en:"EN", fr:"FR", de:"DE", ja:"日本語", zh:"中文" };

function detect() {
  const saved = localStorage.getItem("lang");
  if (LANGS.includes(saved)) return saved;
  for (const l of navigator.languages || [navigator.language]) {
    const m = LANGS.find(x => (l||"").toLowerCase().startsWith(x));
    if (m) return m;
  }
  return "en";
}

function staggerGreeting(text) {
  const h = document.getElementById("greeting");
  h.innerHTML = "";
  [...text].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch"; s.textContent = c;
    s.style.animationDelay = (0.9 + i * 0.045) + "s";
    h.appendChild(s);
  });
}

function apply(lang, first) {
  const t = I18N[lang];
  document.documentElement.lang = lang;
  localStorage.setItem("lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t[el.dataset.i18n] ?? el.textContent;
  });
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  t.cards.forEach(([em, h3, p]) => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = `<span class="em">${em}</span><h3>${h3}</h3><p>${p}</p>`;
    grid.appendChild(d);
  });
  observeCards();
  staggerGreeting(t.greeting);
  if (!first) {
    document.querySelectorAll("#greeting .ch").forEach((s,i) => s.style.animationDelay = (i*0.04)+"s");
  }
  document.querySelectorAll("#langs button").forEach(b =>
    b.classList.toggle("on", b.dataset.lang === lang));
  if (typeof clockTick === "function") try { clockTick(); } catch (_) {}
}

const langsBox = document.getElementById("langs");
LANGS.forEach(l => {
  const b = document.createElement("button");
  b.dataset.lang = l; b.textContent = NAMES[l];
  b.onclick = () => apply(l, false);
  langsBox.appendChild(b);
});

function observeCards() {
  const io = new IntersectionObserver(es => es.forEach((e,) => {
    if (e.isIntersecting) {
      e.target.style.transitionDelay = (Array.from(e.target.parentNode.children).indexOf(e.target) % 3) * 90 + "ms";
      e.target.classList.add("seen");
      io.unobserve(e.target);
    }
  }), { threshold:.2 });
  document.querySelectorAll(".card").forEach(c => io.observe(c));
}

/* Scène : le scroll ouvre le panneau depuis la barre de menus, le tient,
   puis le referme — comme dans la vraie app */
const scene = document.getElementById("scene");
const panel = document.getElementById("panel");
const mbItem = document.getElementById("mb-item");
const sceneTitle = document.getElementById("scene-title");
const sceneSub = document.getElementById("scene-sub");
const parts = [...document.querySelectorAll(".p-part")];
const pctEl = document.getElementById("pct");
const clamp01 = v => Math.min(1, Math.max(0, v));
const ramp = (p, a, b) => clamp01((p - a) / (b - a));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function sceneTick() {
  const rect = scene.getBoundingClientRect();
  const total = scene.offsetHeight - innerHeight;
  const p = clamp01(-rect.top / total);
  const opening = ramp(p, 0.10, 0.36);
  const closing = ramp(p, 0.66, 0.92);
  const vis = reduced ? (p > 0.05 && p < 0.95 ? 1 : 0) : Math.min(opening, 1 - closing);

  panel.style.opacity = vis;
  panel.style.transform = `translateY(${(1 - vis) * -14}px) scaleY(${0.92 + vis * 0.08}) scaleX(${0.97 + vis * 0.03})`;
  mbItem.classList.toggle("open", vis > 0.4);
  parts.forEach((el, i) => {
    const q = clamp01((vis - 0.25 - i * 0.16) / 0.4);
    el.style.opacity = q;
    el.style.transform = `translateY(${(1 - q) * 8}px)`;
  });
  const tvis = Math.min(ramp(p, 0.04, 0.22), 1 - closing);
  [sceneTitle, sceneSub].forEach(el => {
    el.style.opacity = tvis;
    el.style.transform = `translateY(${(1 - tvis) * 10}px)`;
  });
  pctEl.textContent = Math.round(100 * clamp01(vis * 1.4));
}
let sceneRaf = false;
addEventListener("scroll", () => {
  if (sceneRaf) return;
  sceneRaf = true;
  requestAnimationFrame(() => { sceneTick(); sceneRaf = false; });
}, { passive:true });
addEventListener("resize", sceneTick);
sceneTick();

/* Horloge et libellé vivants dans la maquette */
const LOCALES = { en:"en-US", fr:"fr-FR", de:"de-DE", ja:"ja-JP", zh:"zh-CN" };
function clockTick() {
  const d = new Date();
  const loc = LOCALES[document.documentElement.lang] || "en-US";
  const date = d.toLocaleDateString(loc, { weekday:"short", month:"short", day:"numeric" });
  const time = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  document.getElementById("mb-clock").textContent = date + " " + time;
}
clockTick(); setInterval(clockTick, 20000);

// Alternance entre les deux états réels de l'app : sur batterie ⇄ sur secteur
let mbPct = 98, mbMin = 12*60+13, mbPlugged = false;
function mbRender() {
  document.getElementById("icon-batt").style.display = mbPlugged ? "none" : "block";
  document.getElementById("icon-plug").style.display = mbPlugged ? "block" : "none";
  document.getElementById("mb-label").textContent = mbPlugged
    ? "100%"
    : mbPct + "% " + Math.floor(mbMin/60) + ":" + String(mbMin%60).padStart(2,"0");
  document.getElementById("batt-fill").setAttribute("width", (17.8 * mbPct / 100).toFixed(1));
}
mbRender();
setInterval(() => {
  mbMin = Math.max(0, mbMin - 1); if (Math.random() < .12 && mbPct > 90) mbPct--;
  mbRender();
}, 4000);
setInterval(() => { mbPlugged = !mbPlugged; mbRender(); }, 9000);

apply(detect(), true);
</script>
